[project]
name = "stillon"
version = "0.1.0"
description = "A night-desk agent that keeps food-bank households from losing SNAP, Medicaid, and LIHEAP to missed paperwork."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "StillOn contributors" }]
keywords = ["strands-agents", "aws", "agentcore", "benefits", "hackathon"]
dependencies = [
  "strands-agents>=1.0.0",
  "bedrock-agentcore>=0.1.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.0.0",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0.0",
  "reportlab>=4.2.0",
  "boto3>=1.35.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[project.scripts]
stillon = "stillon.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["stillon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

services:
  - type: web
    name: stillon
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: stillon serve --host 0.0.0.0 --port $PORT
    envVars:
      - key: STILLON_DESK_DATE
        value: "2026-09-09"
      - key: STILLON_USE_BEDROCK
        value: "0"
      - key: PYTHON_VERSION
        value: "3.12.8"
